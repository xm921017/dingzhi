name: relay-guard

# 兜底保障：relay（run.yml）每天必须完整跑成功一次。
# GitHub 定时任务只会"延迟"（实测 0.5~7.7h），但偶发被跳过或失败；
# 本工作流每天 UTC 23:30（北京 07:30）检查最近 28 小时内的 relay 运行情况：
#   在跑 / 全部成功        → 什么都不做
#   部分片失败(failure)    → 叫醒 relay-backfill 精确补那几片（已成功的片不重复跑）
#   完全没有 relay 记录    → dispatch 补发一次整班
#
# 历史教训（2026-10-13 修复）：
# 1. 原版本按"当天 UTC 日期"过滤 run，但 relay 计划在 UTC 14:23，被 GitHub 延迟到
#    22:00+ UTC 才创建是常态（实测最晚 22:09 UTC）。若 guard 在 21:30 UTC 检查，
#    当晚的 relay 还没被创建 → 误判"今天没跑"→ 补发 → 一晚双跑、播放翻倍。
#    故 guard 改到 UTC 23:30（晚于实测最晚创建时间），并改用滚动窗口。
# 2. Actions list-runs 的 created 日期过滤参数实测不可靠（会返回未过滤结果），
#    因此这里拉最近 30 条在本地按 created_at 时间戳过滤，不依赖服务端过滤。
# 3. 滚动窗口取 28h：relay 约 24h 一班，窗口 > 24h+最大延迟(约9h)可容忍延迟不误补，
#    同时真丢一整天（上次成功已在约 33h 前）时能补上。
# 4. 原逻辑"窗口内有 success 就不补"漏掉了"部分片失败"的场景：5 片挂 2 片时 run
#    结论是 failure，但 guard 看到窗口内有 success 的片就不动作，失败片的号当天
#    无播放无日常无内容。现改为：取窗口内最近一条 relay run——
#      在跑/成功 → 不动；failure → 补失败片；无记录 → dispatch。
#
# 2026-11-10 修改（巡检 B1）：失败分支不再用 rerun-failed-jobs。
#   本仓 backfill.yml 里写着实测结论：rerun 跑的是「失败那一刻的旧 commit」，而且单个 job
#   拿不到 plan 作业的输出 → NS 为空（run.py 取 1）、SLICE 仍是 matrix 里的片号
#   → sliceBucket(uid,1)=0 → 一个号都分不到，补跑必然再红一次，等于没有兜底。
#   现在改为 dispatch relay-backfill（把 run_id 传成失败那一轮）：由它解析那轮 plan 日志里的
#   ns、按 created_at+8h 算 day，再只 dispatch 失败的那几片（最新代码 + run.py 断点续跑，
#   不会双播）。注意 relay 一结束 backfill 本来就会被 workflow_run 立刻叫醒，所以这里只是
#   「backfill 没跑起来 / 它自己挂了」的兜底 —— 先查这一轮之后有没有成功的 backfill，有就不动。

on:
  schedule:
    - cron: '30 23 * * *'     # UTC 23:30 ≈ 北京 07:30
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: check & repair relay if incomplete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          H = {"Authorization": "Bearer " + TOK,
               "Accept": "application/vnd.github+json",
               "User-Agent": "relay-guard"}

          WINDOW_HOURS = 28

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30))

          def post(url, payload=None):
              req = urllib.request.Request(url, data=json.dumps(payload or {"ref": "main"}).encode(),
                                           headers={**H, "Content-Type": "application/json"},
                                           method="POST")
              return urllib.request.urlopen(req, timeout=30).status

          def parse_ts(s):
              return datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)

          now = datetime.now(timezone.utc)
          window_start = now - timedelta(hours=WINDOW_HOURS)
          # 拉最近 30 条（relay 每天至多 1-2 条，30 条覆盖两周以上），本地按时间戳过滤
          d = get(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=30")
          recent = []
          for r in d.get("workflow_runs", []):
              if r.get("path") != ".github/workflows/run.yml":
                  continue
              try:
                  created = parse_ts(r.get("created_at", ""))
              except Exception:
                  continue
              if created >= window_start:
                  recent.append((created, r))
          recent.sort(key=lambda x: x[0])

          if not recent:
              print(f"窗口 {WINDOW_HOURS}h 内无 relay 记录，dispatch 补发整班")
              print("dispatch HTTP", post(f"https://api.github.com/repos/{REPO}/actions/workflows/run.yml/dispatches"))
              raise SystemExit(0)

          # 注意：recent 排序后取最后一条，日期必须从这条 run 自己的元组元素里取 ——
          # 循环里的 created 变量是「最后一条通过窗口检查的记录」的值，不一定是 latest 的。
          latest_created, latest = recent[-1]
          print(f"窗口 {WINDOW_HOURS}h 内 relay 记录 {len(recent)} 条，最近一条 run {latest['id']} "
                f"created={latest['created_at']} status={latest.get('status')} "
                f"conclusion={latest.get('conclusion')}")

          if latest.get("status") in ("queued", "in_progress", "waiting", "pending"):
              print("最近 relay 正在运行，无需动作")
          elif latest.get("conclusion") == "success":
              print("最近 relay 全部成功，无需动作")
          else:
              # ---- 失败/被取消：交给 relay-backfill 精确补片（不再 rerun-failed-jobs，原因见文件头）----
              # 先看这一轮之后有没有「成功」的 backfill：有就说明已经补过了，什么都不做。
              # 只在 backfill 没跑起来 / 它自己挂了时才由这里补派一次，避免重复补跑。
              handled = False
              try:
                  bd = get(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=30")
                  for r in bd.get("workflow_runs", []):
                      if r.get("path") != ".github/workflows/backfill.yml":
                          continue
                      try:
                          bc = parse_ts(r.get("created_at", ""))
                      except Exception:
                          continue
                      if bc < latest_created:
                          continue
                      if r.get("conclusion") == "success":
                          print(f"这一轮之后已有成功的 relay-backfill（#{r['id']} "
                                f"created={r['created_at']}），判定已补过，无需动作")
                          handled = True
                          break
                      print(f"backfill #{r['id']} status={r.get('status')} "
                            f"conclusion={r.get('conclusion')}（无成功记录，继续看下一条）")
              except Exception as e:
                  print("查 backfill 历史失败（按未补过处理）:", str(e)[:120])

              # 旧代码 / 新代码的判断只作为日志信息：backfill 派出的补跑轮固定 checkout main，
              # 用的必然是当前最新代码，所以这里不再需要「旧代码就跳过」那道闸。
              run_head = latest.get("head_sha")
              try:
                  main_head = get(f"https://api.github.com/repos/{REPO}/commits/main").get("sha")
                  if run_head and main_head and run_head != main_head:
                      print(f"失败 run 用的是旧代码 {run_head[:7]}，main 已到 {main_head[:7]}；"
                            f"backfill 派出的补跑轮会用新代码，正好顺带验证修复")
              except Exception as e:
                  print("获取 main HEAD 失败（不影响补跑）:", str(e)[:120])

              if handled:
                  print("无需动作")
              else:
                  print(f"派发 relay-backfill 精确补跑失败轮 {latest['id']}")
                  try:
                      code = post(f"https://api.github.com/repos/{REPO}/actions/workflows/backfill.yml/dispatches",
                                  {"ref": "main", "inputs": {"run_id": str(latest["id"])}})
                      print("dispatch backfill HTTP", code)
                  except Exception as e:
                      print("::error::派发 relay-backfill 失败，本片失败需人工处理:", str(e)[:150])
                      raise SystemExit(1)
          EOF
