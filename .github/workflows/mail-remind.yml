name: mail-remind

# 定制群到期提醒（2026-11-20 新增，用户口径：剩 30 天 / 15 天各发一封）。
# 发件邮箱 = 本仓 Secrets 的 EMAIL_FROM / EMAIL_AUTH_CODE（定制群自己的 QQ 邮箱 SMTP，
# 与主群发件号完全独立）。链路：mail_remind.py → dz worker /api/mail_scan 入队
# → /api/mail_pending 领取 → SMTP 发送 → /api/mail_sent 回写。
# KV 每日闸门保证扫描一天只全表扫一次，重跑/手动触发都不会重复发。
on:
  # 2026-11-24 定时迁 CF：原 GitHub schedule 已删，由 relay-watchdog 发令表准点 workflow_dispatch（详 cron-relay/watchdog/relay_watchdog.js SCHED_TABLE）
  workflow_dispatch:
    inputs:
      dry:
        description: "只查询不发送（true=演练）"
        required: false
        default: "false"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: scan & send expire reminders
        env:
          WORKER_URL: https://dingzhi.xx1031.xyz
          ASSIGN_PASS: ${{ secrets.ASSIGN_PASS }}
          NB_PASS: ${{ secrets.NB_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          DRY_ARG: ${{ github.event.inputs.dry || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_ARG" = "true" ]; then ARGS="--dry"; fi
          python mail_remind.py $ARGS
