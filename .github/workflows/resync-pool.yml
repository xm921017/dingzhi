name: resync-pool

# 2026-11-01 新增：定期把 D1 号池全量重写一份到 GitHub Secrets（NB_POOL_1..12）。
#
# 为什么需要：
#   KV 里 PUSH_SECRETS 关闭后，Secrets 分片只在「有人手动点 resync」时才更新。
#   10-22 之后再没人刷过，那份快照一直冻在 213 个号 + 当时的旧 MUSIC_U（D1 同期已有 500+ 个）。
#   而 /api/assign 失败时 run.py / make_accounts.py 会回退读它，于是：
#     · 回退那一片拿旧 CK 验活 → 判死活号（10-31 一次性误删 66 个，其中 13 个 CK 实测仍有效）；
#     · 新号根本不在老快照里 → 回退那一片当天漏播漏签。
#   客户端侧已经加了「回退路径不删号」的熔断（10-31），这里再把数据本身刷新，
#   让回退路径至少拿到一份「与 D1 同源」的名单。
#
# 说明：
#   · 只写仓库 Secrets，不动 D1、不动 KV，不影响当天播放；
#   · /api/resync 内部读 D1（mergePool → d1Pool）再强制推送，幂等；
#   · 2026-11-01 定为「每天 relay 开跑前刷一次」：号池每天都有新登记/到期/删除，
#     原来定每周一跑，最坏情况回退时拿到的名单能差 6 天（这 6 天新登记的号
#     全都不在 Secrets 里，回退那一片当天就漏播漏签）。
#     现改为 UTC 13:30 ≈ 北京 21:30，比 relay（北京 22:23）早约 53 分钟 ——
#     抓到的就是「当晚 relay 开始前的最终名单」，把真空窗压到最小。
#     GitHub schedule 偶有十几分钟延迟，53 分钟缓冲足够。

on:
  schedule:
    - cron: '30 13 * * *'    # 每天 UTC 13:30 ≈ 北京 21:30（relay 22:23 前约 53 分钟）
  workflow_dispatch: {}

concurrency:
  group: resync-pool
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: call /api/resync
        env:
          WORKER_URL: https://dingzhi.xx1031.xyz
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          if [ -z "$ADMIN_PASS" ]; then
            echo "::error::缺少 ADMIN_PASS secret，无法调用 resync"
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$WORKER_URL/api/resync" \
            -H 'Content-Type: application/json' \
            --data-binary "$(printf '{"pass":"%s"}' "$ADMIN_PASS")" || echo 000)
          echo "HTTP $code"
          cat /tmp/out.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::resync 失败（HTTP $code），Secrets 分片未更新"
            exit 1
          fi
